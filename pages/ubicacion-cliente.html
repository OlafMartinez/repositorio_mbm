<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBM Sports - Datos de envío</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/carrito.css">
  <link rel="stylesheet" href="/styles/cliente.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 shadow">
  <a href="/pages/carrito.html" class="btn btn-outline-warning">← Volver al carrito</a>
  <span class="navbar-brand mx-auto text-warning fw-bold">Checkout MBM</span>
</nav>

<div class="container centrar-checkout py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 mx-auto">
      <div class="card shadow border-0">
        <div class="card-header bg-white border-0 pt-4">
          <h4 class="text-center mb-0">Información de envío</h4>
          <p class="text-muted text-center">Completa tus datos para continuar</p>
        </div>
        <div class="card-body p-4">
          <form id="formCliente">
            <div class="mb-3">
              <label class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="telefono" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" id="direccion" required>
            </div>
            <div class="row mb-3">
              <div class="col">
                <label class="form-label">Ciudad</label>
                <input type="text" class="form-control" id="ciudad" required>
              </div>
              <div class="col">
                <label class="form-label">Código Postal</label>
                <input type="text" class="form-control" id="cp" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label">Método de pago</label>
              <select class="form-select" id="metodoPago" required>
                <option value="">Selecciona...</option>
                <option value="tarjeta">Tarjeta de crédito/débito</option>
                <option value="paypal">PayPal</option>
                <option value="oxxo">OXXO</option>
              </select>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2">
              Continuar al pago 💳
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="text-center py-3 text-muted border-top mt-4">
  <small>© 2026 MBM Sports - Pago Seguro SSL</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/info-cliente.js"></script>
</body>
</html>
