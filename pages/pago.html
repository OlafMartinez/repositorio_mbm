<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBM Sports - Pago Final</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/carrito.css">
  <link rel="stylesheet" href="/styles/pago.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 shadow">
  <a href="/pages/ubicacion-cliente.html" class="btn btn-outline-warning">← Volver a tus datos</a>
  <span class="navbar-brand mx-auto text-warning fw-bold">Pago Seguro</span>
</nav>

<div class="container centrar-checkout py-4">
  <div class="row g-4">
    
    <!-- Columna del resumen del carrito -->
    <div class="col-md-5 col-lg-4 order-md-last">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-0 pt-3">
          <h5 class="d-flex justify-content-between align-items-center">
            <span>🛒 Tu pedido</span>
            <span class="badge bg-warning text-dark rounded-pill" id="contador-productos">0</span>
          </h5>
        </div>
        <div class="card-body p-0">
          <ul id="lista-resumen" class="list-group list-group-flush"></ul>
        </div>
        <div class="card-footer bg-white border-0 pt-3 pb-3">
          <div class="d-flex justify-content-between fs-5 fw-bold">
            <span>Total (MXN)</span>
            <span id="total" class="text-success">$0.00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Columna del formulario de pago y datos de envío -->
    <div class="col-md-7 col-lg-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h4 class="mb-3">✅ Confirmación de pedido</h4>

          <div class="bg-light p-3 rounded mb-4">
            <h6 class="fw-bold mb-2">📦 Enviar a:</h6>
            <div id="datos-envio">
              <p class="mb-1"><strong>Nombre:</strong> <span id="envio-nombre"></span></p>
              <p class="mb-1"><strong>Dirección:</strong> <span id="envio-direccion"></span></p>
              <p class="mb-1"><strong>Ciudad, CP:</strong> <span id="envio-ciudad-cp"></span></p>
              <p class="mb-1"><strong>Teléfono:</strong> <span id="envio-telefono"></span></p>
              <p class="mb-1"><strong>Email:</strong> <span id="envio-email"></span></p>
            </div>
          </div>

          <form id="form-pago">
            <h6 class="fw-bold mb-3">💳 Datos de pago</h6>
            <div class="mb-3">
              <label class="form-label">Nombre en la tarjeta</label>
              <input type="text" class="form-control" id="cardName" placeholder="Como aparece en la tarjeta" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Número de tarjeta</label>
              <input type="text" class="form-control" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>
            <div class="row mb-3">
              <div class="col">
                <label class="form-label">Fecha expiración</label>
                <input type="text" class="form-control" id="cardExp" placeholder="MM/AA" maxlength="5" required>
              </div>
              <div class="col">
                <label class="form-label">CVV</label>
                <input type="password" class="form-control" id="cardCvv" placeholder="123" maxlength="3" required>
              </div>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Pagar ahora</button>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>

<footer class="text-center py-3 text-muted border-top mt-4">
  <small>© 2026 MBM Sports - Pago Seguro SSL</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/pago.js"></script>
</body>
</html>
