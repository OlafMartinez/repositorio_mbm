<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBM Sports - Finalizar Compra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="stylesheet" href="/styles/carrito.css">
</head>

<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark px-4 shadow">
    <a href="/index.html" class="btn btn-outline-warning">← Volver a la Tienda</a>
    <span class="navbar-brand mx-auto text-warning fw-bold">Checkout MBM</span>
  </nav>

  <div class="container centrar-checkout d-flex align-items-center py-4">
    <div class="row justify-content-center w-100">
      <div class="col-md-6 col-lg-5 mx-auto">
        <h4 class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-dark">🛒 Tu carrito</span>
          <span class="badge bg-warning text-dark rounded-pill" id="contador-productos">0</span>
        </h4>

        <ul id="lista" class="list-group mb-3 shadow-sm"></ul>

        <div class="list-group-item d-flex justify-content-between bg-white p-3 border rounded">
          <span class="fw-bold">Total (MXN)</span>
          <strong id="total" class="text-success fs-5">$0.00</strong>
        </div>

        <hr>
        <button class="btn btn-outline-danger btn-sm w-100 mt-2" onclick="vaciarCarrito()">
          🗑 Vaciar todo el carrito
        </button>

        <!-- Botón para futuro formulario del cliente -->
<button class="btn btn-success w-100 mt-3 fw-bold" onclick="continuarPago()">
  ✅ Continuar con el pago
</button>
      </div>
    </div>
  </div>

  <footer class="text-center py-3 text-muted border-top mt-4">
    <small>© 2026 MBM Sports - Pago Seguro SSL</small>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/scripts/carrito.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', mostrarCarrito);
</script>
</body>

</html>
